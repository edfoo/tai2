[project]
name = "tai2"
version = "0.1.0"
description = "Trading automation interface tai2"
readme = "README.md"
authors = [{ name = "tai2" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "nicegui",
    "python-okx<=0.4.1",
    "okx-sdk>=5.5.812",
    "pandas-ta",
    "redis",
    "asyncpg",
    "pydantic-settings",
    "httpx>=0.28.1",
    "pandas",
    "pytest",
    "pytest-xdist",
    "openrouter",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.pytest.ini_options]
# Run the test suite across all CPU cores by default. Tests are written
# against isolated, dependency-free fixtures (no shared mutable state,
# no module-level monkeypatching), so they are safe to distribute.
addopts = "-n auto"
markers = [
    "network: tests that hit live external services (skipped by default)",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

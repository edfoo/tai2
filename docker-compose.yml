version: '3.8'
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: tai2_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - tai2_db_data:/var/lib/postgresql/data
    restart: unless-stopped
  
  redis:
    image: redis:7
    container_name: tai2_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - ${PWD}/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data

volumes:
  tai2_db_data:
  redis_data:
